<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="utf-8" />
  <title>Discord Call Recorder</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <h1>Discord Call Recorder</h1>

  <div class="rec-controls">
    <button id="recBtn" data-i18n="start">● Sākt ierakstu</button>
    <button id="micBtn" title=""></button>
    <span class="mic-meter" id="micMeter" hidden><span id="micLevel"></span></span>
  </div>

  <div class="row">
    <span id="status" class="muted" data-i18n="statusIdle">Nav ieraksta</span>
    <span id="timer"></span>
  </div>

  <div id="sensor" class="statusline muted" data-i18n="sensorWait">DOM sensors: gaidu Discord tabu…</div>
  <div id="native" class="statusline muted" data-i18n="nativeChecking">Native host: pārbaudu…</div>

  <h2 data-i18n="nowSpeaking">Šobrīd runā</h2>
  <div id="nowSpeaking" class="chips-grid muted">—</div>

  <h2 data-i18n="settings">Iestatījumi</h2>
  <div class="settings">
    <fieldset class="steps">
      <legend><span data-i18n="extSettings">Paplašinājuma iestatījumi</span></legend>
      <label><span data-i18n="uiLang">Interfeisa valoda</span>
        <select id="setUiLang"></select>
      </label>
      <label><span data-i18n="micDevice">Mikrofons</span>
        <select id="setMicDev">
          <option value="" data-i18n="micDefault">sistēmas noklusētais</option>
        </select>
      </label>
      <label><span data-i18n="outDir">Izvades mape</span>
        <span class="dir-wrap">
          <input type="text" id="setOutDir" readonly data-i18n-ph="outDirPh" placeholder="(noklusēti: projekta recordings/)" />
          <button id="dirBtn" type="button" title="…"></button>
        </span>
      </label>
    </fieldset>
    <fieldset class="steps">
      <legend><span data-i18n="autoTrans">Auto-transkripcija</span>
        <span class="switch">
          <input type="checkbox" id="setAuto" checked />
          <span class="knob"></span>
        </span>
      </legend>
      <label><span data-i18n="whisperLang">Valoda</span>
        <select id="setLang"></select>
      </label>
      <label><span data-i18n="liveTrans">Live transkripts</span>
        <span class="switch">
          <input type="checkbox" id="setLive" checked />
          <span class="knob"></span>
        </span>
      </label>
    </fieldset>
    <fieldset class="steps" id="aiSteps" hidden>
      <legend><span data-i18n="aiSettings">AI iestatījumi</span>
        <span class="switch">
          <input type="checkbox" id="setAiAll" checked />
          <span class="knob"></span>
        </span>
      </legend>
      <label id="aiProviderRow" hidden><span data-i18n="aiProvider">AI provider</span>
        <select id="setAiProvider"></select>
      </label>
      <label><span class="lbl-help"><span data-i18n="aiInstance">Instance</span><button id="aiHelpBtn" type="button">?</button></span>
        <select id="setAiInstance"></select>
      </label>
      <div id="aiHelp" class="help" hidden></div>
      <label><span data-i18n="fixConvo">Transkripta auto-labošana</span>
        <span class="switch">
          <input type="checkbox" id="setFixConvo" checked />
          <span class="knob"></span>
        </span>
      </label>
      <label><span data-i18n="edSummary">Kopsavilkums</span>
        <span class="switch">
          <input type="checkbox" id="setReport" checked />
          <span class="knob"></span>
        </span>
      </label>
      <label><span data-i18n="edDecisions">Lēmumi</span>
        <span class="switch">
          <input type="checkbox" id="setDecisions" checked />
          <span class="knob"></span>
        </span>
      </label>
      <label><span data-i18n="edActions">Action items</span>
        <span class="switch">
          <input type="checkbox" id="setActions" checked />
          <span class="knob"></span>
        </span>
      </label>
      <label><span data-i18n="edThreads">Tēmas</span>
        <span class="switch">
          <input type="checkbox" id="setThreads" checked />
          <span class="knob"></span>
        </span>
      </label>
      <label><span data-i18n="autoTitle">Auto-nosaukums</span>
        <span class="switch">
          <input type="checkbox" id="setAutoTitle" checked />
          <span class="knob"></span>
        </span>
      </label>
    </fieldset>
  </div>

  <h2 data-i18n="recordings">Ieraksti</h2>
  <div class="search-wrap">
    <input type="search" id="recSearch" data-i18n-ph="searchPh" placeholder="meklē pēc ID, nosaukuma vai satura" />
    <span class="search-icon"></span>
  </div>
  <div id="recList" class="muted">—</div>

  <div class="events-head">
    <h2 data-i18n="liveTitle">Live transkripts</h2>
    <button id="liveToggle" data-i18n="show">Rādīt</button>
  </div>
  <div id="liveLog" class="console" hidden></div>

  <div class="events-head">
    <h2 data-i18n="events">Notikumi</h2>
    <button id="logToggle" data-i18n="show">Rādīt</button>
  </div>
  <div id="log" class="console" hidden></div>


  <script src="icons.js"></script>
  <script src="i18n.js"></script>
  <script src="panel.js"></script>
</body>
</html>
