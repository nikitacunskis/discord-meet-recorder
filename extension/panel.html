<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="utf-8" />
  <title>Discord Call Recorder</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <h1>Discord Call Recorder</h1>

  <div id="sensor" class="row muted">DOM sensors: gaidu Discord tabu…</div>
  <div id="native" class="row muted">Native host: pārbaudu…</div>

  <div class="row">
    <button id="startBtn">● Sākt ierakstu</button>
    <button id="stopBtn" disabled>■ Beigt un saglabāt</button>
  </div>

  <div class="row">
    <span id="status" class="muted">Nav ieraksta</span>
    <span id="timer"></span>
  </div>

  <h2>Šobrīd runā</h2>
  <div id="nowSpeaking" class="chips muted">—</div>

  <details id="logDetails">
    <summary>Notikumi</summary>
    <div id="log"></div>
  </details>


  <div id="cmdBlock" hidden>
    <h2>Transkripcijas komanda</h2>
    <pre id="cmd"></pre>
    <button id="copyCmd">Kopēt komandu</button>
  </div>

  <h2>Iestatījumi</h2>
  <div class="settings">
    <label>Claude CLI
      <select id="setClaude">
        <option value="claude">claude (~/.claude)</option>
        <option value="claude-personal">claude-personal (~/.claude-personal)</option>
        <option value="claude-rgp">claude-rgp (~/.claude-rgp)</option>
      </select>
    </label>
    <label>Valoda
      <select id="setLang">
        <option value="auto" selected>auto</option>
        <option value="lv">latviešu</option>
        <option value="ru">krievu</option>
        <option value="en">angļu</option>
      </select>
    </label>
    <label class="check">
      <input type="checkbox" id="setReport" checked />
      Claude atskaite (--report)
    </label>
    <label class="check">
      <input type="checkbox" id="setAuto" checked />
      Auto-transkripcija pēc ieraksta (native host)
    </label>
    <label>Izvades mape
      <input type="text" id="setOutDir" placeholder="(noklusēti: projekta recordings/)" />
    </label>
  </div>

  <h2>Ieraksti</h2>
  <div id="recList" class="muted">—</div>

  <script src="panel.js"></script>
</body>
</html>
