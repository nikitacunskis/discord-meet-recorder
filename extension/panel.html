<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="utf-8" />
  <title>Discord Call Recorder</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <h1>Discord Call Recorder</h1>

  <div class="rec-controls">
    <button id="recBtn" data-i18n="start">● Sākt ierakstu</button>
    <button id="micBtn" title=""></button>
  </div>

  <div class="row">
    <span id="status" class="muted" data-i18n="statusIdle">Nav ieraksta</span>
    <span id="timer"></span>
  </div>

  <div id="sensor" class="statusline muted" data-i18n="sensorWait">DOM sensors: gaidu Discord tabu…</div>
  <div id="native" class="statusline muted" data-i18n="nativeChecking">Native host: pārbaudu…</div>

  <h2 data-i18n="nowSpeaking">Šobrīd runā</h2>
  <div id="nowSpeaking" class="chips-grid muted">—</div>

  <h2 data-i18n="settings">Iestatījumi</h2>
  <div class="settings">
    <label><span data-i18n="uiLang">Interfeisa valoda</span>
      <select id="setUiLang">
        <option value="en">English</option>
        <option value="lv">Latviešu</option>
        <option value="de">Deutsch</option>
        <option value="zh">中文</option>
      </select>
    </label>
    <label><span data-i18n="claudeCli">Claude CLI</span>
      <select id="setClaude">
        <option value="claude">claude (~/.claude)</option>
        <option value="claude-personal">claude-personal (~/.claude-personal)</option>
        <option value="claude-rgp">claude-rgp (~/.claude-rgp)</option>
      </select>
    </label>
    <label><span data-i18n="whisperLang">Valoda</span>
      <select id="setLang">
        <option value="auto" selected data-i18n="langAuto">auto</option>
        <option value="lv" data-i18n="langLv">latviešu</option>
        <option value="ru" data-i18n="langRu">krievu</option>
        <option value="en" data-i18n="langEn">angļu</option>
      </select>
    </label>
    <div class="toggles">
      <label class="check">
        <input type="checkbox" id="setAuto" checked />
        <span data-i18n="autoTrans">Auto-transkripcija pēc ieraksta (native host)</span>
      </label>
      <label class="check">
        <input type="checkbox" id="setReport" checked />
        <span data-i18n="report">Claude atskaite (--report)</span>
      </label>
    </div>
    <label><span data-i18n="outDir">Izvades mape</span>
      <span class="dir-wrap">
        <input type="text" id="setOutDir" readonly data-i18n-ph="outDirPh" placeholder="(noklusēti: projekta recordings/)" />
        <button id="dirBtn" type="button" title="…"></button>
      </span>
    </label>
  </div>

  <h2 data-i18n="recordings">Ieraksti</h2>
  <div class="search-wrap">
    <input type="search" id="recSearch" data-i18n-ph="searchPh" placeholder="meklē pēc ID, nosaukuma vai satura" />
    <span class="search-icon"></span>
  </div>
  <div id="recList" class="muted">—</div>

  <div class="events-head">
    <h2 data-i18n="events">Notikumi</h2>
    <button id="logToggle" data-i18n="show">Rādīt</button>
  </div>
  <div id="log" class="console" hidden></div>

  <div id="cmdBlock" hidden>
    <h2 data-i18n="cmdTitle">Transkripcijas komanda</h2>
    <pre id="cmd"></pre>
    <button id="copyCmd" data-i18n="copyCmd">Kopēt komandu</button>
  </div>

  <script src="icons.js"></script>
  <script src="i18n.js"></script>
  <script src="panel.js"></script>
</body>
</html>
